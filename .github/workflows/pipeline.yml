name: Build and Push NextJS Image

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  GITOPS_REPO: PCI.GitOps.AlibabaCloud

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Convert repo to lowercase
      run: |
        echo "REPO_LOWER=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

    - name: Log in to GHCR
      uses: docker/login-action@v2
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GH_TOKEN }}

    - name: Generate version (timestamp)
      id: version
      run: |
        VERSION=$(1.0.0)
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Build and Push Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: |
          ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}:latest
          ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}:${{ steps.version.outputs.version }}

    # 🚀 CD PART (GitOps Update)
    - name: Update GitOps repo with new image
      run: |
        git clone https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/${{ github.repository_owner }}/${{ env.GITOPS_REPO }}.git

        cd ${{ env.GITOPS_REPO }}

        # 🔥 Update image tag in kustomization.yaml
        sed -i "s|\(ghcr.io/prosperian-capital/pci.smartstox.webapp:\).*|\1${{ steps.version.outputs.version }}|g" k8s/overlays/production/kustomization.yml

        git config user.name "github-actions"
        git config user.email "actions@github.com"

        git add .
        git commit -m "🚀 Update smartstox-webapp image to ${{ steps.version.outputs.version }}"
        git push