name: Build and Push NextJS Image

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Convert repo to lowercase
      run: |
        echo "REPO_LOWER=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GH_TOKEN }}

    - name: Generate version (timestamp)
      id: version
      run: |
        echo "version=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

    - name: Build and Push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: |
          ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}:latest
          ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}:${{ steps.version.outputs.version }}

    - name: Update GitOps repo and deploy
      run: |
          # Clone GitOps repo
          git clone https://${{ secrets.GITOPS_TOKEN }}@github.com/prosperian-capital/PCI.GitOps.AlibabaCloud.git
          cd PCI.GitOps.AlibabaCloud

          # Update ONLY webapp image tag
          sed -i '/name: ghcr.io\/prosperian-capital\/pci.smartstox.webapp/{n;s/newTag:.*/newTag: '"${{ steps.version.outputs.version }}"'/;}' k8s/overlays/production/kustomization.yml

          # Commit changes
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git commit -am "Update webapp image to ${{ steps.version.outputs.version }}"
          git push
